<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Retro Vaporwave 80s Sun & Fuji Mountain -->
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="40%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Big Circular Badge -->
  <circle cx="250" cy="240" r="180" fill="none" stroke="#f43f5e" stroke-width="4"/>

  <!-- Giant Retro Sunset with Laser Horizon Lines -->
  <g clip-path="url(#sunClip)">
    <circle cx="250" cy="220" r="140" fill="url(#sunGrad)"/>
    <!-- Horizontal blind slats -->
    <rect x="100" y="240" width="300" height="6" fill="#18181b"/>
    <rect x="100" y="260" width="300" height="9" fill="#18181b"/>
    <rect x="100" y="285" width="300" height="13" fill="#18181b"/>
    <rect x="100" y="315" width="300" height="18" fill="#18181b"/>
  </g>

  <!-- Mountain Silhouette / Fuji -->
  <polygon points="250,150 140,320 360,320" fill="#0f172a"/>
  <!-- Snowcap -->
  <polygon points="250,150 215,205 235,195 250,210 265,195 285,205" fill="#ffffff"/>

  <!-- Aesthetic Grid Ground -->
  <g stroke="#06b6d4" stroke-width="1.5" opacity="0.7">
    <line x1="120" y1="320" x2="380" y2="320"/>
    <line x1="100" y1="340" x2="400" y2="340"/>
    <line x1="80" y1="365" x2="420" y2="365"/>
    <line x1="250" y1="320" x2="250" y2="380"/>
    <line x1="210" y1="320" x2="180" y2="380"/>
    <line x1="290" y1="320" x2="320" y2="380"/>
    <line x1="170" y1="320" x2="110" y2="380"/>
    <line x1="330" y1="320" x2="390" y2="380"/>
  </g>

  <!-- Japanese Kanji & English Subtext -->
  <text x="250" y="425" font-family="'Impact', 'Arial Black', sans-serif" font-size="30" fill="#ffffff" text-anchor="middle" letter-spacing="8">FUTURE DREAMS</text>
  <text x="250" y="455" font-family="'Arial Black', sans-serif" font-size="14" fill="#06b6d4" text-anchor="middle" letter-spacing="6">TOKYO VAPORWAVE // 1988</text>
</svg>
