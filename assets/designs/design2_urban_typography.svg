  </defs>
  <!-- Frame Box -->
  <rect x="25" y="25" width="450" height="450" fill="none" stroke="#ffffff" stroke-width="6"/>
  <rect x="35" y="35" width="430" height="430" fill="none" stroke="#111111" stroke-width="2"/>
  
  <!-- Corner Tech Crosses -->
  <path d="M45,45 L65,45 M55,35 L55,55" stroke="#ffffff" stroke-width="3"/>
  <path d="M435,45 L455,45 M445,35 L445,55" stroke="#ffffff" stroke-width="3"/>
  <path d="M45,455 L65,455 M55,445 L55,465" stroke="#ffffff" stroke-width="3"/>
